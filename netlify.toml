[build]
  publish = "."
  command = "node scripts/build-blog.js"

# Pretty URLs — serve .html files without extension
[[redirects]]
  from = "/workshops"
  to = "/workshops.html"
  status = 200

[[redirects]]
  from = "/journal"
  to = "https://portal.ourpathguidance.co.uk/login"
  status = 302

[[redirects]]
  from = "/journal.html"
  to = "https://portal.ourpathguidance.co.uk/login"
  status = 302

[[redirects]]
  from = "/book"
  to = "https://portal.ourpathguidance.co.uk/session-zero"
  status = 302

[[redirects]]
  from = "/book.html"
  to = "https://portal.ourpathguidance.co.uk/session-zero"
  status = 302

[[redirects]]
  from = "/mentoring"
  to = "/mentoring.html"
  status = 200

[[redirects]]
  from = "/organisations"
  to = "/organisations.html"
  status = 200

[[redirects]]
  from = "/referral"
  to = "/referral.html"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/our-story"
  to = "/our-story.html"
  status = 200

# Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
